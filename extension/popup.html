<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CobraDeals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 13px;
  }
  .header {
    background: #0f0f23;
    padding: 14px 16px;
    border-bottom: 1px solid #2a2a4e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-logo { font-size: 22px; }
  .header-text h1 { font-size: 14px; font-weight: 700; color: #00ff88; }
  .header-text p  { font-size: 11px; color: #666; }
  .status { padding: 12px 16px; border-bottom: 1px solid #2a2a4e; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: #555;
  }
  .status-dot.active { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
  #status-text { color: #888; }
  .section { padding: 10px 16px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #555; margin-bottom: 8px; }
  .retailer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #1e1e3e;
    text-decoration: none;
    color: #c0c0dc;
    cursor: pointer;
    transition: color 0.15s;
    font-size: 12px;
  }
  .retailer-row:last-child { border-bottom: none; }
  .retailer-row:hover { color: #00ff88; }
  .icon { width: 20px; text-align: center; }
  .name { flex: 1; }
  .search-all {
    display: block;
    width: calc(100% - 32px);
    margin: 8px 16px 12px;
    padding: 9px;
    background: #00ff88;
    color: #0a0a1a;
    border: none;
    border-radius: 7px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .search-all:hover { background: #00e67a; }
  .tip {
    padding: 8px 16px 12px;
    font-size: 11px;
    color: #444;
    line-height: 1.5;
  }
  #product-info { display: none; }
  #product-info.visible { display: block; }
  .product-name {
    font-weight: 600;
    color: #b0b0c8;
    margin-bottom: 4px;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-price { color: #00ff88; font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">🐍</div>
  <div class="header-text">
    <h1>CobraDeals</h1>
    <p>Find cheaper prices automatically</p>
  </div>
</div>
<div class="status">
  <span class="status-dot" id="dot"></span>
  <span id="status-text">Checking page...</span>
</div>
<div id="product-info" class="section">
  <div class="section-title">Detected Product</div>
  <div class="product-name" id="product-name"></div>
  <div class="product-price" id="product-price"></div>
</div>
<div class="section">
  <div class="section-title">Search On</div>
  <div id="retailers"></div>
</div>
<button class="search-all" id="search-all">Search All Comparison Sites</button>
<p class="tip">💡 On any product page, look for the 🐍 button in the bottom-right corner.</p>
<script src="popup.js"></script>
</body>
</html>
